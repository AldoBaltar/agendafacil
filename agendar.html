<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendar - AgendaFácil</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <div class="container cabecalho-conteudo">
      <a class="logo" href="index.html"><img src="img/logo.png" alt="" width="44" height="48"><span>AgendaFácil</span></a>
      <nav>
        <ul class="menu">
          <li><a href="index.html">Início</a></li>
          <li><a href="servicos.html">Serviços</a></li>
          <li><a href="profissionais.html">Profissionais</a></li>
          <li><a href="agendar.html" class="ativo">Agendar</a></li>
          <li><a href="agenda.html">Agenda do dia</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Agendar</h1>
      <form class="formulario">
        <fieldset>
          <legend>Seus dados</legend>
          <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required>
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone">
          </div>
        </fieldset>

        <fieldset>
          <legend>Sobre a consulta</legend>
          <div class="campo">
            <label for="servico">Serviço</label>
            <select id="servico" name="servico">
              <option>Consulta clínica geral</option>
              <option>Consulta de retorno</option>
              <option>Limpeza dental</option>
              <option>Avaliação nutricional</option>
              <option>Sessão de fisioterapia</option>
            </select>
          </div>
          <div class="campo">
            <label for="profissional">Profissional</label>
            <select id="profissional" name="profissional">
              <option>Dra. Marina Lopes</option>
              <option>Dr. Paulo Mendes</option>
              <option>Dra. Carla Nogueira</option>
              <option>Dr. Rafael Souza</option>
            </select>
          </div>
          <div class="campo">
            <label for="data">Data</label>
            <input type="date" id="data" name="data" required>
          </div>
          <div class="campo">
            <label for="observacao">Observação (opcional)</label>
            <textarea id="observacao" name="observacao" rows="4"></textarea>
          </div>
        </fieldset>
      </form>
    </div>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>AgendaFácil - projeto da disciplina de Desenvolvimento Frontend</p>
      <p>Autores: Aldo Baltar e Pedro Pereira</p>
    </div>
  </footer>
</body>
</html>
